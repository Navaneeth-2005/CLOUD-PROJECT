version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: codestorm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: cloudjudge
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codestorm-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password123
      DB_NAME: cloudjudge
      DB_PORT: 3306
      JWT_SECRET: codestorm_jwt_secret_2024
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: codestorm-worker
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: password123
      DB_NAME: cloudjudge
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker:/app
      - /app/node_modules

volumes:
  mysql_data: